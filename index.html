<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Luna</title>
<meta name="description" content="Luna, 25, virtuelle Berlinerin. Alle Inhalte sind KI generiert.">
<meta name="robots" content="noindex">
<style>
  :root { --bg:#f6f1ea; --ink:#2b2420; --muted:#7a6e66; --btn:#2b2420; --btnink:#f6f1ea; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--ink); font-family: Georgia, "Times New Roman", serif;
         min-height:100vh; display:flex; align-items:center; justify-content:center; padding:32px 16px; }
  main { width:100%; max-width:380px; text-align:center; }
  .ava { width:132px; height:132px; border-radius:50%; object-fit:cover; display:block; margin:0 auto 18px; }
  h1 { font-weight:normal; font-size:28px; margin-bottom:6px; }
  p { color:var(--muted); font-size:15px; line-height:1.5; margin-bottom:26px; }
  a.btn { display:block; background:var(--btn); color:var(--btnink); text-decoration:none;
          padding:16px 18px; border-radius:30px; font-size:16px; margin-bottom:12px; }
  a.ig { background:transparent; color:var(--ink); border:1px solid var(--ink); }
  .gal { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin-bottom:22px; }
  .gal img { width:100%; aspect-ratio:4/5; object-fit:cover; border-radius:10px; display:block; }
  small { display:block; color:var(--muted); font-size:12px; margin-top:22px; line-height:1.5; }
</style>
</head>
<body>
<main>
  <img class="ava" src="luna.jpg" alt="Luna">
  <h1>Luna</h1>
  <p>25, Berlin. Kaffee, Altbau und ein bisschen mehr.</p>
  <div class="gal">
    <img src="g/luna-1.jpg" alt="Luna im schwarzen Kleid" loading="lazy">
    <img src="g/luna-2.jpg" alt="Luna an der Spree" loading="lazy">
    <img src="g/luna-3.jpg" alt="Luna im Trenchcoat" loading="lazy">
  </div>
  <a class="btn" href="https://www.fanvue.com/luna.aesthetic/fv-1">Meine privaten Fotos (18+)</a>
  <a class="btn ig" href="https://www.instagram.com/luna.aestheticofficial/">Instagram</a>
  <small>Alle Inhalte sind KI generiert.<br>Nur für Erwachsene ab 18 Jahren.</small>
</main>
</body>
</html>
